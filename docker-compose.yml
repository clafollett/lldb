# A whole lldb cluster on one host, to prove the distributed communication path end-to-end:
# a MinIO object store (the S3 warehouse), a fleet of stateless workers, and a coordinator that
# ships a physical plan to a worker over Arrow Flight and prints the result.
#
#   docker compose up --build            # bring the cluster up; coordinator prints a result
#   docker compose run --rm coordinator lldb-qe-coordinator --workers http://worker-1:50051 \
#     --storage s3 --s3-bucket lldb-warehouse --s3-endpoint http://minio:9000 --s3-allow-http \
#     --manifest /manifests/tpch.toml --sql "SELECT ..."   # run your own query
#
# The default coordinator query is a constant, so the cluster proves cross-container transport
# without needing seeded data; point --manifest at real S3 data to run real queries.
#
# Image/version knobs (both optional):
#   LLDB_IMAGE  — tag every service runs (default lldb:latest). CI prebuilds a cached, versioned
#                 image and sets this so `up`/`run` reuse it instead of rebuilding.
#   LLDB_GIT_SHA — commit stamped into the binaries at build time (reported by `--version`).

# Shared build config: one image, both roles. The SHA is injected because `.git` is not in the
# build context (see .dockerignore).
x-lldb-build: &lldb-build
  context: .
  args:
    GIT_SHA: ${LLDB_GIT_SHA:-unknown}

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  LLDB_STORAGE: s3
  LLDB_S3_BUCKET: lldb-warehouse
  LLDB_S3_ENDPOINT: http://minio:9000
  LLDB_S3_REGION: us-east-1
  LLDB_S3_ALLOW_HTTP: "true"
  RUST_LOG: info

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: create the warehouse bucket, then exit.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/lldb-warehouse &&
      echo 'bucket ready';
      "

  worker-1:
    build: *lldb-build
    image: ${LLDB_IMAGE:-lldb:latest}
    command: ["lldb-qe-worker", "--bind", "0.0.0.0:50051"]
    environment: *s3-env
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker-2:
    build: *lldb-build
    image: ${LLDB_IMAGE:-lldb:latest}
    command: ["lldb-qe-worker", "--bind", "0.0.0.0:50051"]
    environment: *s3-env
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: ship a plan to a worker and print the result, then exit.
  coordinator:
    build: *lldb-build
    image: ${LLDB_IMAGE:-lldb:latest}
    command:
      - "lldb-qe-coordinator"
      - "--workers"
      - "http://worker-1:50051,http://worker-2:50051"
      - "--manifest"
      - "/manifests/empty.toml"
      - "--sql"
      - "SELECT 42 AS answer, 'distributed hello' AS greeting"
    environment: *s3-env
    volumes:
      - ./manifests:/manifests:ro
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
