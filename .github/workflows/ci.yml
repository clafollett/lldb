name: CI

# There is deliberately NO `paths-ignore` here, and that is the whole design.
#
# A markdown-only change runs no code and should not spend ~25 minutes in the cross-container
# cluster job — but `paths-ignore` buys that by skipping the WORKFLOW, and a workflow that never
# runs never reports a status. Under a ruleset with required status checks that is a trap: the PR
# sits on "Expected — Waiting for status" for a check that is never coming, and only an admin
# override can merge it. `main` is a protected default branch here, so the filtering lives in the
# jobs instead: the `changes` job below always runs, and each real job carries an `if:`. A job
# skipped by `if:` still produces a check run (conclusion `skipped`) rather than no check at all,
# which is what keeps a required check satisfiable.
#
# If a required check ever does sit pending on a docs-only PR, the fallback is to make the job
# always run and no-op internally rather than to reintroduce `paths-ignore`.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # What moved in this push/PR, as two booleans the real jobs gate on.
  #
  # Computed with plain `git diff` rather than a third-party path-filter action, for the reason
  # every dependency in this repo is argued for: one more action is one more thing to pin, audit
  # and keep current, and this is fifteen lines of shell.
  #
  # **It fails OPEN.** Anything it cannot work out — a base ref it cannot resolve, a force-push
  # whose `before` sha is gone, an empty diff — sets both outputs true and runs the whole suite.
  # A filter that guesses wrong in the direction of "skip" hides a broken build; guessing wrong
  # toward "run" only costs runner minutes.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      # Full history: the diff needs the merge base, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            if git rev-parse --verify -q "origin/$BASE_REF" >/dev/null; then
              files=$(git diff --name-only "origin/$BASE_REF...HEAD" || true)
            fi
          elif [ -n "${BEFORE:-}" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$SHA" || true)
          fi

          if [ -z "$files" ]; then
            echo "could not determine the changed files — running everything"
            printf 'rust=true\ninfra=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"; printf '%s\n' "$files" | sed 's/^/  /'

          rust=false
          infra=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # Markdown is an input to nothing here: the manifests the tests read are TOML and
              # build.rs reads only the git sha. Listed first so a .md under .github/ is still docs.
              *.md)       ;;
              # A change to CI itself must exercise every job it governs.
              .github/*)  rust=true; infra=true ;;
              # The CDK app is TypeScript and does not depend on the Rust build.
              infra/*)    infra=true ;;
              *)          rust=true ;;
            esac
          done <<< "$files"

          echo "rust=$rust infra=$infra"
          printf 'rust=%s\ninfra=%s\n' "$rust" "$infra" >> "$GITHUB_OUTPUT"

  # Fast path: format, lint, and the in-process test suite. Integration tests that need SF1
  # data or Docker skip themselves, so this stays green without either.
  check:
    name: fmt • clippy • test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The services-database test (crates/lldb-qe-core/tests/integration/services_db.rs) proves claims only a real server can
    # settle — that the migrations apply, that re-applying them is a no-op, and that deleting an
    # account cascades to its warehouses. It skips itself when no database is reachable, so
    # without this container CI would report green on a test that never ran. Same 18.4 as compose.
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: lldb
          POSTGRES_PASSWORD: lldb
          POSTGRES_DB: lldb
        # This job runs directly on the runner, not inside a `container:`. In that mode the
        # service's Docker-network hostname (`postgres`) does NOT resolve from a step — the port
        # has to be published and reached over `localhost`. Do not "simplify" this to
        # `postgres:5432` and drop the mapping; the test would go back to silently skipping.
        # The host side is deliberately not 5432: nothing should collide with a runner that
        # happens to have its own Postgres up.
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lldb -d lldb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # `rustup show` installs the toolchain pinned by rust-toolchain.toml (1.97.1).
      - name: Install pinned toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          # Point the services-database test at the service container above so it actually runs
          # instead of printing its skip message.
          LLDB_TEST_POSTGRES_URL: postgres://lldb:lldb@localhost:55432/lldb?sslmode=disable
        run: cargo test --workspace

  # Proves the distributed communication path across real containers (MinIO + worker fleet +
  # coordinator over gRPC/Arrow Flight). Runs the LLDB_DOCKER-gated cluster test.
  #
  # The image is built once here with buildx + the GitHub Actions layer cache, so cargo-chef's
  # dependency layer is reused across runs (first run ~15 min; cached runs a couple). The test
  # then reuses that prebuilt image (LLDB_IMAGE) instead of building again.
  docker-cluster:
    name: cross-container cluster
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: docker/setup-buildx-action@v3

      - name: Compute build version
        id: ver
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lldb:ci
          build-args: |
            GIT_SHA=${{ steps.ver.outputs.sha }}
            CARGO_PROFILE_RELEASE_LTO=false
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          cache-from: type=gha,scope=lldb-image
          cache-to: type=gha,mode=max,scope=lldb-image

      - name: Cross-container distributed smoke test
        env:
          LLDB_DOCKER: "1"
          LLDB_IMAGE: lldb:ci
        run: cargo test -p lldb-qe-core --test distributed_cluster -- --nocapture

  # The CDK app is real code with real invariants (one image tag fleet-wide, no world-open
  # Flight port), so it gets the same bar as the Rust crates: it must compile, pass its
  # assertion tests, and synthesize valid CloudFormation.
  infra:
    name: cdk synth • test
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Synth
        run: npx cdk synth -c imageTag=0.1.0+ci --quiet
