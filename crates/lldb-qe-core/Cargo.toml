[package]
name = "lldb-qe-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core library for lldb: storage abstraction, session/catalog setup, and execution nodes."

[dependencies]
# The control plane, DataFusion-free, one crate down. `lldb-qe-core` depends on it directly —
# stacked, not siblings, and deliberately with zero port traits: the dependency graph is acyclic
# once `rbac`'s vocabulary and `StorageConfig` live in `lldb-qe-types`, so an abstraction to invert
# it would buy nothing but indirection. See issue #72.
lldb-qe-control = { path = "../lldb-qe-control" }
lldb-qe-types = { path = "../lldb-qe-types" }
datafusion.workspace = true
datafusion-proto.workspace = true
iceberg.workspace = true
iceberg-datafusion.workspace = true
iceberg-catalog-sql.workspace = true
arrow-flight.workspace = true
object_store.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
futures.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true
sqlx.workspace = true
chrono.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
base64.workspace = true
# `rustls`, `hex`, `rand` and `tracing-subscriber` left with the control plane (`tls`, `auth`,
# `liveness`, `config`) and nothing in this crate reaches for them any more.
# `tracing-subscriber` stays below as a dev-dependency: one integration test still installs one.

[dev-dependencies]
tokio.workspace = true
anyhow.workspace = true
criterion.workspace = true
datafusion.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
# The services-database integration test issues raw SQL (foreign keys, information_schema) that
# has no business on `ServicesDb`'s public API, so it needs sqlx/chrono in its own right.
sqlx.workspace = true
chrono.workspace = true
# The TLS integration tests mint their own self-signed certificate; see the workspace manifest for
# why that is a dev-dependency rather than a committed PEM.
rcgen.workspace = true

# Each criterion bench statically links the whole dependency graph again: 629 MB of the target
# directory (`distributed` 323 MB + `tpch` 306 MB), 27% of its executable bytes, for targets that
# are run deliberately and rarely. `cargo test` never built them; only `--all-targets` did, so
# gating them costs the edit-test loop nothing and takes 629 MB off every default build.
#
# CI compiles them anyway: the clippy step in `.github/workflows/ci.yml` passes
# `--features lldb-qe-core/benches`, so a bench that stops compiling still fails the build. That
# pairing is the point — without it the benches would rot, which is exactly why issue #44 rejected
# this gate. #44 priced it on *time* and was right about time (~0.5 s on a 37 s gate); the axis
# that moved is disk. See docs/build-performance.md.
[features]
benches = []

[[bench]]
name = "tpch"
harness = false
required-features = ["benches"]

[[bench]]
name = "distributed"
harness = false
required-features = ["benches"]
