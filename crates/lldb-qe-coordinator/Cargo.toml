[package]
name = "lldb-qe-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "lldb coordinator: plans a query and runs it on a remote worker over Arrow Flight."
# This package also ships the control-plane one-shots (`src/bin/lldb-qe-migrate.rs`,
# `src/bin/lldb-qe-warehouse.rs`), which makes a bare `cargo run -p lldb-qe-coordinator`
# ambiguous. The coordinator stays the default.
default-run = "lldb-qe-coordinator"

[dependencies]
lldb-qe-core = { path = "../lldb-qe-core" }
datafusion.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
# `lldb-qe-auth` turns `--expires-in-days` into a timestamp.
chrono.workspace = true
