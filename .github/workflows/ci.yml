name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast path: format, lint, and the in-process test suite. Integration tests that need SF1
  # data or Docker skip themselves, so this stays green without either.
  check:
    name: fmt • clippy • test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `rustup show` installs the toolchain pinned by rust-toolchain.toml (1.97.1).
      - name: Install pinned toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Proves the distributed communication path across real containers (MinIO + worker fleet +
  # coordinator over gRPC/Arrow Flight). Runs the LLDB_DOCKER-gated cluster test.
  #
  # The image is built once here with buildx + the GitHub Actions layer cache, so cargo-chef's
  # dependency layer is reused across runs (first run ~15 min; cached runs a couple). The test
  # then reuses that prebuilt image (LLDB_IMAGE) instead of building again.
  docker-cluster:
    name: cross-container cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: docker/setup-buildx-action@v3

      - name: Compute build version
        id: ver
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lldb:ci
          build-args: |
            GIT_SHA=${{ steps.ver.outputs.sha }}
          cache-from: type=gha,scope=lldb-image
          cache-to: type=gha,mode=max,scope=lldb-image

      - name: Cross-container distributed smoke test
        env:
          LLDB_DOCKER: "1"
          LLDB_IMAGE: lldb:ci
        run: cargo test -p lldb-qe-core --test distributed_cluster -- --nocapture
