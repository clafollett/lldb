# A whole lldb cluster on one host, to prove the distributed communication path end-to-end:
# a MinIO object store (the S3 warehouse), a Postgres services database (the control plane), two
# *virtual warehouses* worth of stateless workers, and a coordinator that ships a physical plan
# over Arrow Flight and prints the result.
#
# Startup order is a chain of conditions, not sleeps: minio → minio-setup, postgres → db-migrate
# → warehouse-setup, and every lldb role waits for those one-shots to *exit successfully*.
# Migrations are a one-shot step on purpose — see the docs on `lldb-qe-migrate` for why a fleet
# must not migrate itself.
#
#   docker compose up --build            # bring the cluster up; coordinator prints a result
#   docker compose run --rm coordinator lldb-qe-coordinator --workers http://worker-1:50051 \
#     --storage s3 --s3-bucket lldb-warehouse --s3-endpoint http://minio:9000 --s3-allow-http \
#     --manifest /manifests/tpch.toml --sql "SELECT ..."   # run your own query
#
# The default coordinator query is a constant, so the cluster proves cross-container transport
# without needing seeded data; point --manifest at real S3 data to run real queries.
#
# SHARED ICEBERG CATALOG: `manifests/shared-catalog.toml` declares `backend = { kind = "sql" }`,
# which puts catalog state in the Postgres above instead of in one process's memory — so every
# role sees the same tables and the same snapshot. It needs no `uri`: the LLDB_METADATA_* below
# already name the database, and a password has no business in a manifest.
#
#   docker compose run --rm coordinator lldb-qe-coordinator \
#     --workers http://worker-1:50051,http://worker-2:50051 \
#     --manifest /manifests/shared-catalog.toml --sql 'SELECT count(*) FROM shared.sales.orders'
#
# Its warehouse is the `warehouse` volume below, not MinIO, and that is a real constraint rather
# than a preference: iceberg 0.10 ships no object-store StorageFactory, so a sql catalog with an
# `s3://` warehouse is refused at startup instead of silently writing table metadata to one
# container's local disk (see the `lakehouse` module docs). Table *data* still lives in S3; it is
# the Iceberg metadata that needs a filesystem every role can reach, hence a shared volume.
# ---- Virtual warehouses, locally -----------------------------------------------------------
#
# Two named pools of compute over the *same* MinIO warehouse and the same catalog: `analytics`
# (worker-1 + worker-2) and `etl` (worker-etl). Each is registered under a Docker **network
# alias** equal to its name, which is the local stand-in for Cloud Map: resolving `analytics`
# returns every container carrying that alias, exactly as `analytics.lldb.local` returns every
# task in that ECS service. So the coordinator's routing code is identical in both places — only
# the endpoint template differs (`http://{warehouse}:50051` here, `<name>.lldb.local` on ECS).
#
#   # route a query to a specific warehouse (resolved in Postgres, then discovered by DNS)
#   docker compose run --rm coordinator lldb-qe-coordinator --warehouse etl \
#     --manifest /manifests/empty.toml --sql "SELECT 42"
#
#   # the lifecycle: the CLI writes desired state, compose applies it
#   docker compose run --rm warehouse-setup lldb-qe-warehouse list
#   docker compose run --rm warehouse-setup lldb-qe-warehouse resize --name etl --size 3
#   docker compose up -d --scale worker-etl=3          # ← apply it; parallelism changes, no rebuild
#   docker compose run --rm warehouse-setup lldb-qe-warehouse suspend --name etl
#   docker compose up -d --scale worker-etl=0          # ← apply it; the compute is freed
#
# That two-step is the design, not an omission: the services database holds *desired* state and
# something else actuates it (compose here, `aws ecs update-service` or a deploy on AWS). The
# engine carries no orchestrator SDK — see crates/lldb-qe-core/src/warehouse.rs for why.
#
# ---- One query, or many ---------------------------------------------------------------------
#
# Two coordinator shapes ship in this image and both are here. `coordinator` is the one-shot: it
# plans a query, runs it, prints, exits — that is what the cross-container smoke test drives.
# `query-server` is the long-running scheduler (issue #18): it holds the catalog open, accepts
# concurrent submissions on 50050, admits a bounded number per warehouse, queues the rest, and
# records every query's state and timings in the `queries` table.
#
# Image/version knobs (both optional):
#   LLDB_IMAGE  — tag every service runs (default lldb:latest). CI prebuilds a cached, versioned
#                 image and sets this so `up`/`run` reuse it instead of rebuilding.
#   LLDB_GIT_SHA — commit stamped into the binaries at build time (reported by `--version`).

# Shared build config: one image, both roles. The SHA is injected because `.git` is not in the
# build context (see .dockerignore).
x-lldb-build: &lldb-build
  context: .
  args:
    GIT_SHA: ${LLDB_GIT_SHA:-unknown}
    # This cluster is a demo/dev target running a constant query, so it wants fast *builds*, not
    # fast binaries. Thin LTO with one codegen unit adds many minutes of whole-program link time
    # to every rebuild. Override for a release image: LLDB_LTO=thin LLDB_CODEGEN_UNITS=1.
    CARGO_PROFILE_RELEASE_LTO: ${LLDB_LTO:-false}
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${LLDB_CODEGEN_UNITS:-16}

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  LLDB_STORAGE: s3
  LLDB_S3_BUCKET: lldb-warehouse
  LLDB_S3_ENDPOINT: http://minio:9000
  LLDB_S3_REGION: us-east-1
  LLDB_S3_ALLOW_HTTP: "true"
  RUST_LOG: info

# Services-database (control plane) connection, in the discrete-parts form. Deliberately not a
# single LLDB_METADATA_URL: that is the shape ECS/Fargate can wire up, where the password arrives
# as its own Secrets Manager–backed variable and nothing can string-interpolate it into a URL.
# Keeping compose on the same shape means the two environments exercise the same code path.
x-metadata-env: &metadata-env
  LLDB_METADATA_HOST: postgres
  LLDB_METADATA_PORT: "5432"
  LLDB_METADATA_DATABASE: lldb
  LLDB_METADATA_USER: lldb
  LLDB_METADATA_PASSWORD: lldb
  LLDB_METADATA_SSLMODE: disable

# How `--warehouse <name>` becomes an address here. Compose's DNS serves bare network aliases
# with no namespace suffix, so the template has no `.lldb.local` — the CDK stack sets
# `http://{warehouse}.lldb.local:50051` for the same flag. One template, two spellings of DNS.
x-warehouse-env: &warehouse-env
  LLDB_WAREHOUSE_ENDPOINT: http://{warehouse}:50051

services:
  # The shared services database: accounts and the Iceberg SQL catalog today, query history next.
  # One instance for the whole cluster — the entire point is that every role sees the same rows.
  # `iceberg_tables` / `iceberg_namespace_properties` appear here too; they are created by
  # `iceberg-catalog-sql` itself on first open, not by `lldb-qe-migrate`.
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: lldb
      POSTGRES_PASSWORD: lldb
      POSTGRES_DB: lldb
    ports:
      # Published so `psql -h localhost -p 5432 -U lldb lldb` can inspect the control plane while
      # the cluster runs. Local-only credentials; nothing here is a production posture.
      - "5432:5432"
    volumes:
      # NOT `/var/lib/postgresql/data` — that is the Postgres <=17 layout. The 18 images moved
      # PGDATA to a version-scoped subdirectory (`/var/lib/postgresql/18/docker`) and declare
      # `/var/lib/postgresql` itself as the volume, so mounting the old path both fails to
      # persist anything and leaves a root-owned directory inside the postgres-owned tree.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # `pg_isready` is the only honest readiness signal: the container prints "ready to accept
      # connections" once during its own bootstrap, before the real server starts.
      test: ["CMD-SHELL", "pg_isready -U lldb -d lldb"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: apply the embedded migrations and seed the `default` account, then exit. Every
  # lldb role depends on this *completing successfully*, so nothing queries a schema-less
  # database and nothing races to create the schema itself.
  db-migrate:
    build: *lldb-build
    image: ${LLDB_IMAGE:-lldb:latest}
    command: ["lldb-qe-migrate", "--seed-account", "default"]
    environment:
      <<: *metadata-env
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: declare the two demo warehouses in the control plane, then exit.
  #
  # `--if-not-exists` is what makes this safe on every `up`: it returns the existing warehouse
  # *unchanged*, so a rerun cannot undo a resize or resume something an operator suspended. The
  # sizes here must match the container counts below — that correspondence is the thing an
  # operator maintains by hand, and the coordinator logs a warning when they drift.
  warehouse-setup:
    build: *lldb-build
    image: ${LLDB_IMAGE:-lldb:latest}
    entrypoint:
      - /bin/sh
      - -c
      - >
        lldb-qe-warehouse create --name analytics --size 2 --if-not-exists &&
        lldb-qe-warehouse create --name etl --size 1 --if-not-exists &&
        lldb-qe-warehouse list
    environment:
      <<: *metadata-env
      RUST_LOG: info
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: create the warehouse bucket, then exit.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/lldb-warehouse &&
      echo 'bucket ready';
      "

  # ---- Warehouse `analytics`: two workers -----------------------------------------------------
  # Both carry the network alias `analytics`, so Docker's DNS answers that name with *both*
  # container IPs — one A-record per "task", which is what `discover_workers` fans a plan across.
  # They keep their own service names too, because addressing one worker directly is still how
  # the cross-container smoke test proves the transport.
  worker-1:
    build: *lldb-build
    image: ${LLDB_IMAGE:-lldb:latest}
    command: ["lldb-qe-worker", "--bind", "0.0.0.0:50051"]
    # Workers execute serialized plans and do not open the catalog themselves yet, but they get
    # the services-DB config and the shared warehouse now: the Iceberg SQL catalog landed with
    # #8, and the moment a worker resolves a table by name it must read the same catalog rows —
    # and the same metadata files — the coordinator planned against.
    environment:
      <<: [*s3-env, *metadata-env]
    volumes:
      - warehouse:/var/lib/lldb/warehouse
    networks:
      default:
        aliases: [analytics]
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker-2:
    build: *lldb-build
    image: ${LLDB_IMAGE:-lldb:latest}
    command: ["lldb-qe-worker", "--bind", "0.0.0.0:50051"]
    # Workers execute serialized plans and do not open the catalog themselves yet, but they get
    # the services-DB config and the shared warehouse now: the Iceberg SQL catalog landed with
    # #8, and the moment a worker resolves a table by name it must read the same catalog rows —
    # and the same metadata files — the coordinator planned against.
    environment:
      <<: [*s3-env, *metadata-env]
    volumes:
      - warehouse:/var/lib/lldb/warehouse
    networks:
      default:
        aliases: [analytics]
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- Warehouse `etl`: one worker, independently sized ---------------------------------------
  # Deliberately a *scalable* service (no fixed container_name, no published port), so
  # `docker compose up -d --scale worker-etl=3` is the local equivalent of an ECS desired-count
  # change: three containers, all aliased `etl`, and the next query fans across all three with no
  # rebuild and no restart of anything else. That is "resizing changes parallelism" on a laptop.
  worker-etl:
    build: *lldb-build
    image: ${LLDB_IMAGE:-lldb:latest}
    command: ["lldb-qe-worker", "--bind", "0.0.0.0:50051"]
    environment:
      <<: [*s3-env, *metadata-env]
    volumes:
      # Same shared Iceberg metadata as every other role. A warehouse is a separate pool of
      # *compute*, not of storage — the whole point is that `analytics` and `etl` read one
      # catalog over one warehouse. Omitting this would give this pool its own empty metadata
      # tree and it would report tables the others can see as missing.
      - warehouse:/var/lib/lldb/warehouse
    networks:
      default:
        aliases: [etl]
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      warehouse-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- The query server: a long-running coordinator ------------------------------------------
  #
  # The other shape of a coordinator. `coordinator` below runs one query and exits; this one stays
  # up, accepts queries over Arrow Flight on 50050, bounds how many run at once per warehouse,
  # queues the rest, and writes every one to `queries` in Postgres.
  #
  #   # submit through it with any Flight client; the ticket is
  #   #   <u32 account_len><account><u32 warehouse_len><warehouse><sql>
  #   docker compose logs -f query-server
  #   psql -h localhost -U lldb lldb -c \
  #     'SELECT id, state, warehouse_id, started_at - submitted_at AS queued, \
  #             finished_at - started_at AS ran FROM queries ORDER BY id DESC LIMIT 10'
  #
  # IMPORTANT: admission control is per *process*. Scaling this service to two replicas doubles
  # the number of queries a warehouse will run at once, because neither replica can see the other.
  # See crates/lldb-qe-core/src/scheduler.rs.
  query-server:
    build: *lldb-build
    image: ${LLDB_IMAGE:-lldb:latest}
    command:
      - "lldb-qe-server"
      - "--bind"
      - "0.0.0.0:50050"
      - "--workers"
      - "http://worker-1:50051,http://worker-2:50051"
      - "--manifest"
      - "/manifests/empty.toml"
    ports:
      - "50050:50050"
    environment:
      <<: [*s3-env, *metadata-env, *warehouse-env]
    volumes:
      - ./manifests:/manifests:ro
      - warehouse:/var/lib/lldb/warehouse
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      warehouse-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50050"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: ship a plan to a worker and print the result, then exit.
  coordinator:
    build: *lldb-build
    image: ${LLDB_IMAGE:-lldb:latest}
    command:
      - "lldb-qe-coordinator"
      - "--workers"
      - "http://worker-1:50051,http://worker-2:50051"
      - "--manifest"
      - "/manifests/empty.toml"
      - "--sql"
      - "SELECT 42 AS answer, 'distributed hello' AS greeting"
    environment:
      <<: [*s3-env, *metadata-env, *warehouse-env]
    volumes:
      - ./manifests:/manifests:ro
      # The Iceberg metadata a `sql` catalog writes. A named volume rather than MinIO because
      # iceberg 0.10 has no object-store StorageFactory (see the header), and it must be shared
      # so a worker reads the same metadata files the coordinator committed.
      - warehouse:/var/lib/lldb/warehouse
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      # So that `docker compose run --rm coordinator lldb-qe-coordinator --warehouse etl …`
      # always finds the warehouse rows already declared.
      warehouse-setup:
        condition: service_completed_successfully

# Named so the control plane survives `docker compose down` (but not `down -v`, which is what
# the cluster smoke test uses to start from a clean slate).
volumes:
  pgdata:
  # Iceberg table metadata for `sql`-catalog manifests, shared by every lldb role. The catalog
  # rows in Postgres point at metadata files, so a catalog every process can read is only half
  # the story — they must be able to read the files it names, too.
  warehouse:
