[package]
name = "lldb-qe-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "lldb coordinator: plans a query and runs it on a remote worker over Arrow Flight."
# This package also ships `src/bin/lldb-qe-server.rs`, the long-running scheduler, which makes a
# bare `cargo run -p lldb-qe-coordinator` ambiguous. The one-shot coordinator stays the default.
#
# Both targets here run queries, and that is now the entry rule for this package: because cargo
# resolves dependencies per package rather than per binary, anything living here compiles the whole
# DataFusion graph below. The control-plane one-shots that do not run queries — `lldb-qe-migrate`,
# `lldb-qe-warehouse`, `lldb-qe-auth`, `lldb-qe-reap` — are in `lldb-qe-admin` for that reason. Do
# not add a binary here unless it needs the engine.
default-run = "lldb-qe-coordinator"

[dependencies]
lldb-qe-core = { path = "../lldb-qe-core" }
datafusion.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
